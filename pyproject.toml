[project]
name = "toyssd"
version = "0.1.0"
description = "Modular SSD simulator skeleton backed by SystemC"
readme = "docs/ssd_sim_design.md"
requires-python = ">=3.10"
authors = [
  { name = "toyssd contributors" }
]
dependencies = [
  "attrs>=23.2.0",
  "invoke>=2.2.0",
  "numpy>=1.26.0",
  "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "mypy>=1.8.0",
  "types-invoke>=2.0.0.10",
  "cpplint>=1.6.1",
  "ruff>=0.2.0"
]

[build-system]
requires = ["scikit-build-core>=0.7.0", "setuptools", "wheel"]
build-backend = "scikit_build_core.build"

[tool.uv.sources]
toyssd = { path = "python", editable = true }

[tool.scikit-build]
minimum-version = "0.7"
wheel.py-api = "cp311"
cmake.define.TOYSSD_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.isort]
profile = "black"
