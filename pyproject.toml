[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.28", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "toyssd"
version = "0.1.0"
description = "SystemC-based toy SSD simulator with Python bindings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chris Hurley" }]
dependencies = [
  "cppyy>=3.0",
]

[project.optional-dependencies]
dev = [
  "invoke>=2.2",
  "build>=1.2",
  "pytest>=8.0",
  "rich>=13.0",
  "cpplint>=1.6.1",
  "ruff>=0.6.0",
  "mypy>=1.10",
  "gcovr>=7.0",
]
viz = [
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[tool.scikit-build]
wheel.py-api = "py3"

[tool.scikit-build.cmake.define]
TOYSSD_BUILD_PYTHON = "ON"

[tool.ruff]
src = ["python", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","SIM","FBT","A","C4","DTZ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
packages = ["toyssd"]
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
mypy_path = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
addopts = "-ra"
