name: macos-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            label: ARM64
          - runner: macos-15-intel
            label: Intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install clang tools
        run: |
          if ! brew list llvm >/dev/null 2>&1; then
            brew install llvm
          fi
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Bootstrap toolchain
        run: uv run invoke bootstrap

      - name: Build
        run: uv run invoke build

      - name: Run tests
        run: uv run invoke test

      - name: Verify cmake availability
        run: |
          echo "=== Verifying cmake availability for debugging ==="
          echo "Current PATH: $PATH"
          echo "Checking cmake location:"
          which cmake || echo "WARNING: cmake not found in PATH"
          echo "Checking cmake version:"
          cmake --version || echo "WARNING: cmake command failed"
          echo "=== End of cmake verification ==="

      - name: Lint
        env:
          PATH: "${{ env.LLVM_PREFIX }}/bin:${{ env.PATH }}"
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: uv run invoke lint

      - name: Check Python formatting
        run: uv run python -m ruff format --check python

      - name: Check clang-format
        env:
          PATH: "${{ env.LLVM_PREFIX }}/bin:${{ env.PATH }}"
        run: |
          set -eo pipefail
          files=$(git ls-files '*.cpp' '*.hpp')
          if [[ -n "$files" ]]; then
            for file in $files; do
              diff -u "$file" <(clang-format --style=file "$file")
            done
          fi
