# CI workflow for deterministic builds.
# Goals:
# - Use uv for fast, reproducible Python environments.
# - Delegate orchestration (bootstrap/build/test/lint) to Invoke tasks to keep
#   CI logic DRY.

name: toyssd-ci

# Trigger on pushes to main + every PR so gate + post-merge builds share coverage.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-dev:
    if: github.base_ref == '' || github.base_ref == 'main'
    # Run macOS matrix for pushes (base_ref empty) and PRs targeting main only.
    # Native macOS coverage to ensure the SystemC toolchain builds on both Apple Silicon
    # and Intel runners (matches local developer environments).
    name: toyssd • macOS • invoke • ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    env:
      # Pin compilers both CMake uses Apple Clang.
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      CMAKE_C_COMPILER: /usr/bin/clang
      CMAKE_CXX_COMPILER: /usr/bin/clang++
    strategy:
      matrix:
        include:
          # Prefer the latest macOS ARM64 image.
          - runner: macos-latest
            label: ARM64
          # Intel macOS runner for x86_64 architecture testing.
          - runner: macos-15-intel
            label: Intel
    defaults:
      run:
        shell: bash  # Consistent shell semantics across platforms
    steps:
      - uses: actions/checkout@v5  # Fetch repository sources

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Aligns with pyproject and typing targets

      - name: Install uv
        # Fast, reproducible Python environments without heavy virtualenv 
        # overhead.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install clang tools
        # Install recent LLVM utilities (clang-format/clang-tidy) from Homebrew.
        # We still compile using Apple Clang (see env above) for reliable SDK
        # integration. A newer LLVM is useful for format/tidy versions.
        run: |
          if ! brew list llvm >/dev/null 2>&1; then
            brew install llvm
          fi
          llvm_prefix="$(brew --prefix llvm)"
          echo "LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"

      - name: Configure macOS SDK
        # Export SDK and arch to prevent header/framework resolution drift and
        # arch mismatches. This mirrors the logic in tools/invoke_tasks.py.
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          arch="$(uname -m)"
          if [[ "$arch" == "aarch64" ]]; then
            arch="arm64"
          fi
          echo "CMAKE_OSX_ARCHITECTURES=$arch" >> "$GITHUB_ENV"

      - name: Install CMake
        # Ensure a modern CMake is available for FetchContent and better
        # diagnostics.
        run: |
          if ! brew list cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          cmake_prefix="$(brew --prefix cmake)"
          echo "$cmake_prefix/bin" >> "$GITHUB_PATH"

      - name: Bootstrap toolchain
        # Runs Invoke bootstrap to install Python deps and configure CMake.
        # See tools/invoke_tasks.py: bootstrap
        run: uv run invoke bootstrap

      - name: Build
        # Compiles targets using the configured build tree.
        # See tools/invoke_tasks.py: build
        run: uv run invoke build

      - name: Run tests
        # Executes C++ tests via ctest and Python tests via pytest.
        # See tools/invoke_tasks.py: test
        run: uv run invoke test

      - name: Lint
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        # Runs clang-tidy/cpplint/ruff as configured by Invoke.
        # Pinning CC/CXX keeps compile_commands coherent for clang-tidy.
        run: uv run invoke lint

      - name: Check Python formatting
        # Enforce Ruff formatter in check-only mode to fail on style drift.
        run: uv run python -m ruff format --check python

      - name: Check clang-format
        # Show unified diffs against the repository's .clang-format rules.
        # set -eo pipefail ensures the step fails on any diff or subcommand 
        # error.
        run: |
          set -eo pipefail
          files=$(git ls-files '*.cpp' '*.hpp')
          if [[ -n "$files" ]]; then
            for file in $files; do
              diff -u "$file" <(clang-format --style=file "$file")
            done
          fi

      - name: Capture Python dependencies
        if: always()
        run: |
          set -euo pipefail
          output="python-deps-${{ matrix.label }}.txt"
          if command -v uv >/dev/null 2>&1; then
            uv pip freeze > "${output}"
          else
            echo "uv command unavailable; dependency manifest not captured." > "${output}"
          fi

      - name: Upload dependency manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-deps-${{ matrix.label }}
          path: python-deps-${{ matrix.label }}.txt

  docker-dev:
    # Linux baseline that builds the dev container and exercises the same Invoke
    # tasks inside it. Guarantees parity between the published Docker image,
    # VS Code devcontainers, and CI.
    name: toyssd • Docker • invoke suite
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container image
        # Build the multi-stage Dockerfile up to the dev target so we can reuse
        # the same environment developers get via `docker build --target dev`.
        run: docker build --target dev -t toyssd-dev:ci .

      - name: Invoke tasks inside container
        # Run bootstrap/build/test/lint inside the container to ensure the
        # containerized workflow stays healthy.
        run: |
          docker run --rm -u root \
            -v "${{ github.workspace }}":/workspaces/toyssd \
            toyssd-dev:ci \
            bash -lc "cd /workspaces/toyssd && invoke bootstrap && invoke build && invoke test && invoke lint"

      - name: Capture dependencies from dev container
        if: always()
        run: |
          set -euo pipefail
          output="python-deps-docker.txt"
          if docker image inspect toyssd-dev:ci >/dev/null 2>&1; then
            docker run --rm toyssd-dev:ci bash -lc "python -m pip freeze" > "${output}"
          else
            echo "toyssd-dev:ci image missing; dependency manifest not captured." > "${output}"
          fi

      - name: Upload docker dependency manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-deps-docker
          path: python-deps-docker.txt

  docker-coverage:
    # Runs coverage-only gates inside the dev container on Ubuntu to keep
    # results reproducible and aligned with CI.
    name: toyssd • Docker • coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container image
        run: docker build --target dev -t toyssd-dev:coverage .

      - name: Run coverage task inside container
        run: |
          docker run --rm -u root \
            -v "${{ github.workspace }}":/workspaces/toyssd \
            toyssd-dev:coverage \
            bash -lc "cd /workspaces/toyssd && invoke bootstrap && invoke coverage --fail-under-cpp 90 --fail-under-python 60"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage

  codex-scripts:
    # Ensure the Codex setup/maintenance scripts stay healthy on a clean Ubuntu
    # image that mirrors Codex (GitHub's ubuntu-24.04 runner).
    name: toyssd • Ubuntu • Codex setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Run setup + maintenance scripts
        env:
          SYSTEMC_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          ./run/setup.sh
          ./run/maintenance_setup.sh
