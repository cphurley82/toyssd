name: build-and-test

on:
  push:
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: toyssd
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Python tools and Configure + Build in Docker
        run: |
          # Ensure cpplint is available during CMake configure so the CTest is registered
          docker run --rm -t -v "$PWD":/src -w /src toyssd \
            bash -lc "python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release"
          docker run --rm -t -v "$PWD":/src -w /src toyssd \
            cmake --build build -j
      - name: Archive build directory (tar.gz)
        run: |
          tar -czf build.tar.gz build
      - name: Upload build archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-archive
          path: build.tar.gz
          if-no-files-found: error
      - name: Save Docker image to tar
        run: |
          docker save toyssd -o toyssd-image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: toyssd-image.tar
          if-no-files-found: error
      - name: Upload build directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dir
          path: build
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .
      - name: Load Docker image
        run: |
          docker load -i toyssd-image.tar
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-archive
          path: .
      - name: Extract build archive
        run: |
          tar -xzf build.tar.gz
      - name: Run unit tests (ctest) in Docker (excluding demo)
        run: |
          docker run --rm -t -v "$PWD":/src -w /src toyssd \
            ctest --test-dir build --output-on-failure --no-tests=error -LE demo

      - name: Publish unit test results (GoogleTest XML)
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            build/test-results/gtest/**/*.xml

      - name: Upload test XMLs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtest-xml
          path: build/test-results/gtest/**/*.xml
          if-no-files-found: warn

  demo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .
      - name: Load Docker image
        run: |
          docker load -i toyssd-image.tar
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-archive
          path: .
      - name: Extract build archive
        run: |
          tar -xzf build.tar.gz
      - name: Run CTest demo in Docker
        run: |
          docker run --rm -t -v "$PWD":/src -w /src toyssd \
            ctest --test-dir build -L demo --output-on-failure
